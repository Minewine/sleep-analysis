# CI (docs/ARCHITECTURE.md §6.6): every PR runs the Android build + unit tests +
# Android lint + the four policy gates (permissions allowlist, forbidden claim
# terms, repo hygiene, network-host allowlist) — all wired into :app:check — and
# the Python tooling under uv (ruff + pytest).
#
# The instrumented Room migration test (app/src/androidTest) additionally runs on a
# KVM-accelerated emulator in the `instrumented` job below (and locally via
# ./gradlew :app:connectedDebugAndroidTest).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  android:
    name: Gradle assemble · unit tests · lint · policy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, lint, policy gates
        # :app:check = unit tests + Android lint (abortOnError) + checkPermissionAllowlist
        # + checkForbiddenTerms + checkRepoHygiene + checkNetworkHosts.
        # Retry once: AGP's lint analysis workers crash nondeterministically under parallel
        # load ("Unexpected failure during lint analysis") — always clean on rerun.
        run: |
          ./gradlew :app:check :app:assembleDebug :app:assembleDebugAndroidTest || \
          ./gradlew :app:check :app:assembleDebug :app:assembleDebugAndroidTest

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM group perms (GitHub runners ship /dev/kvm)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: MigrationTest on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: ./gradlew :app:connectedDebugAndroidTest

  python:
    name: ruff · pytest (tools + analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest
