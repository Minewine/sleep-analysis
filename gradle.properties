# Project-wide Gradle settings. 6g heap: lint's analysis workers crash under parallel
# load with smaller heaps ("Unexpected failure during lint analysis" — nondeterministic,
# clean on rerun; hits the test-source lintAnalyze* tasks).
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
